server {
    listen       80 default_server;
    listen       [::]:80 default_server;
    server_name  _;

    # Only public/ is served. The Jenkinsfile and deploy/ stay invisible.
    root   /var/www/ci-lab/public;
    index  index.html;

    access_log  /var/log/nginx/ci-lab.access.log;
    error_log   /var/log/nginx/ci-lab.error.log;

    location / {
        try_files $uri $uri/ =404;
    }

    # Build stamp: shows which build is live. Never cached.
    location = /BUILD.txt {
        default_type text/plain;
        add_header Cache-Control "no-store";
    }

    # Never expose Git history
    location ~ /\.git {
        deny all;
    }
}
